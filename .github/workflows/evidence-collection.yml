name: Evidence Collection (signed)

# Produces audit evidence an auditor can verify independently:
#   gh release download evidence-YYYY-MM-DD --repo OWNER/REPO
#   gh attestation verify repo_security.json --repo OWNER/REPO
on:
  schedule:
    - cron: "0 13 1 * *"   # 1st of every month
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  security-events: read   # lets the live collector read code-scanning alerts
  attestations: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Collect live
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CCM_REPOS: ${{ github.repository }}
        run: python3 refresh.py --live

      - name: Build evidence bundle + manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: python3 evidence/make_bundle.py --run-url "$RUN_URL" --actor "$ACTOR"

      - name: Sign every file (build provenance attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "bundle/*"

      - name: Publish dated evidence Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          day=$(date -u +%F)
          tag="evidence-$day"
          if gh release view "$tag" >/dev/null 2>&1; then tag="$tag-run$RUN_NUMBER"; fi
          gh release create "$tag" bundle/* --title "Evidence $day" --notes-file bundle/MANIFEST.md
